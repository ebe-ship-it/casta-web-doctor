services:
  - type: web
    name: casta-web-doctor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webapp:app --workers 2 --threads 4 --timeout 30
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
